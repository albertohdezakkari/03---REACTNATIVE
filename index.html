<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cuaderno 0 interactivo de React Native con Expo: configuración y diseño visual." />
  <title>Cuaderno 0 · React Native + Expo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">RN</div>
        <div>
          <strong>Cuaderno 0</strong>
          <span>React Native + Expo</span>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-copy">
          <span>Progreso</span>
          <strong id="progressText">0%</strong>
        </div>
        <div class="progress-track" aria-label="Progreso del cuaderno">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <small id="progressDetail">0 de 10 ejercicios completados</small>
      </div>

      <nav class="exercise-nav" aria-label="Navegación del cuaderno">
        <button class="nav-item active" data-screen="intro">
          <span class="nav-index">00</span>
          <span>
            <strong>Inicio</strong>
            <small>Configuración</small>
          </span>
        </button>
        <div id="exerciseMenu"></div>
        <button class="nav-item" data-screen="quiz">
          <span class="nav-index">✓</span>
          <span>
            <strong>Repaso final</strong>
            <small>20 preguntas con feedback</small>
          </span>
        </button>
      </nav>

      <button id="resetProgress" class="reset-button">Reiniciar progreso</button>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <span id="screenEyebrow">CUADERNO DE APRENDIZAJE</span>
          <strong id="screenTitle">React Native + Expo</strong>
        </div>
        <div class="save-status" id="saveStatus">Guardado</div>
      </header>

      <main id="appContent" class="content"></main>

      <footer class="lesson-footer">
        <button id="prevButton" class="secondary-button">← Anterior</button>
        <button id="completeButton" class="complete-button hidden">Marcar como completado</button>
        <button id="nextButton" class="primary-button">Siguiente →</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
